<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OwnChannel">
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="oc-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="oc-shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#oc-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#oc-shine)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>
  <!-- broadcast arcs from the screen corner -->
  <path d="M392 104 A46 46 0 0 1 438 150" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M392 64 A86 86 0 0 1 478 150" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.55"/>
  <!-- glass TV screen -->
  <rect x="80" y="150" width="312" height="208" rx="46" fill="url(#oc-glass)" stroke="#fff" stroke-opacity="0.9" stroke-width="16"/>
  <!-- play -->
  <path d="M212 210 L290 254 L212 298 Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round"/>
  <!-- stand -->
  <path d="M176 398 H296" stroke="#fff" stroke-opacity="0.9" stroke-width="18" stroke-linecap="round"/>
</svg>
